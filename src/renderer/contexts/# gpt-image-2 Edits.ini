# gpt-image-2 接入配置参考（2026-04 更新）

## 一、模型概述

gpt-image-2 是 OpenAI 当前主力图像生成/编辑模型（dall-e-3 已于 2026 年初退役）。
- 支持任意分辨率（需满足约束条件）
- 原生返回 b64_json（非 URL）
- 支持多图输入编辑（最多 16 张）
- 支持透明背景输出
- prompt 长度上限 32,000 字符

---

## 二、Generations 接口（文生图）

### 请求

```
POST /v1/images/generations
Content-Type: application/json
Authorization: Bearer {{YOUR_API_KEY}}
```

### 请求体

```json
{
  "model": "gpt-image-2",
  "prompt": "A cute cat wearing sunglasses",
  "size": "1024x1024",
  "quality": "auto",
  "n": 1,
  "background": "auto",
  "response_format": "b64_json"
}
```

### 参数说明

| 参数 | 类型 | 必填 | 默认值 | 说明 |
|------|------|------|--------|------|
| model | string | ✅ | - | 固定 `gpt-image-2` |
| prompt | string | ✅ | - | 图片描述，最长 32,000 字符 |
| size | string | ❌ | auto | 输出尺寸，见下方尺寸表 |
| quality | string | ❌ | auto | `low` / `medium` / `high` / `auto` |
| n | integer | ❌ | 1 | 生成数量，1-10 |
| background | string | ❌ | auto | `transparent` / `opaque` / `auto` |
| response_format | string | ❌ | b64_json | `url` 或 `b64_json` |
| compression | integer | ❌ | - | 压缩级别 0-100（webp/jpeg 输出时有效） |

---

## 三、Edits 接口（图生图 / 图片编辑）

### 请求

```
POST /v1/images/edits
Content-Type: multipart/form-data
Authorization: Bearer {{YOUR_API_KEY}}
```

### 请求体（FormData）

| 字段 | 类型 | 必填 | 说明 |
|------|------|------|------|
| model | string | ✅ | 固定 `gpt-image-2` |
| prompt | string | ✅ | 编辑指令 |
| image | file(s) | ✅ | 参考图，支持多图（最多 16 张） |
| size | string | ❌ | 输出尺寸 |
| quality | string | ❌ | `low` / `medium` / `high` / `auto` |
| n | integer | ❌ | 生成数量 1-10 |
| background | string | ❌ | `transparent` / `opaque` / `auto` |
| response_format | string | ❌ | `url` 或 `b64_json`，默认 b64_json |

---

## 四、尺寸规范

### 常用尺寸

| 尺寸 | 说明 |
|------|------|
| 1024x1024 | 1K 正方形 |
| 1536x1024 | 1K 横版 |
| 1024x1536 | 1K 竖版 |
| 2048x2048 | 2K 正方形 |
| 2048x1152 | 2K 横版 |
| 1152x2048 | 2K 竖版 |
| 3840x2160 | 4K 横版 |
| 2160x3840 | 4K 竖版 |
| auto | 默认（模型自动选择） |

### 尺寸约束

1. 最大边长 ≤ 3840px
2. 两边都必须是 16px 的倍数
3. 长边:短边 ≤ 3:1
4. 总像素 ≥ 655,360 且 ≤ 8,294,400

---

## 五、响应格式

### 成功响应

```json
{
  "created": 1713833628,
  "data": [
    {
      "b64_json": "iVBORw0KGgo..."
    }
  ],
  "usage": {
    "total_tokens": 100,
    "input_tokens": 50,
    "output_tokens": 50,
    "input_tokens_details": {
      "text_tokens": 10,
      "image_tokens": 40
    }
  }
}
```

> 注意：gpt-image-2 默认返回 b64_json 而非 URL。
> 若需 URL，显式指定 `response_format: "url"`。

---

## 六、OpenAPI Specification（Edits）

```yaml
openapi: 3.0.1
info:
  title: gpt-image-2 Edits
  version: 2.0.0
paths:
  /v1/images/edits:
    post:
      summary: gpt-image-2 图片编辑
      tags:
        - 绘图模型/OpenAI 格式
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer {{YOUR_API_KEY}}
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  description: 参考图片，支持多图（最多16张）
                  type: string
                  format: binary
                prompt:
                  type: string
                  example: 带上眼镜
                model:
                  type: string
                  example: gpt-image-2
                size:
                  type: string
                  enum:
                    - auto
                    - 1024x1024
                    - 1536x1024
                    - 1024x1536
                    - 2048x2048
                    - 2048x1152
                    - 1152x2048
                    - 3840x2160
                    - 2160x3840
                quality:
                  type: string
                  enum: [low, medium, high, auto]
                  default: auto
                n:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
                background:
                  type: string
                  enum: [transparent, opaque, auto]
                  default: auto
                response_format:
                  type: string
                  enum: [url, b64_json]
                  default: b64_json
              required:
                - image
                - prompt
                - model
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        b64_json:
                          type: string
                        url:
                          type: string
                  usage:
                    type: object
components:
  schemas: {}
servers: []
```

